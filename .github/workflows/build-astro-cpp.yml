name: Build Diplomka Native C++ APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'kit_parts/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'Diplomka_Native_CPP_Source.zip'
      - '.github/workflows/build-astro-cpp.yml'

permissions:
  contents: read

concurrency:
  group: diplomka-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Android arm64-v8a release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reconstruct source ZIP from kit_parts (if needed)
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$GITHUB_WORKSPACE/Diplomka_Native_CPP_Source.zip"
          PARTS="$GITHUB_WORKSPACE/kit_parts"
          if [ -f "$ARCHIVE" ]; then
            echo "Archive already present"
            exit 0
          fi
          if [ ! -f "$PARTS/manifest.json" ]; then
            echo "No archive and no kit_parts/manifest.json — will try tree build"
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path
          import base64, json, hashlib, sys
          parts_dir = Path('kit_parts')
          manifest = json.loads((parts_dir / 'manifest.json').read_text())
          chunks = []
          for i in range(manifest['parts']):
              p = parts_dir / f"Diplomka_Native_CPP_Source.zip.{i:02d}.b64"
              if not p.exists():
                  print(f'Missing shard {p}', file=sys.stderr)
                  sys.exit(1)
              chunks.append(p.read_text().strip())
          data = base64.b64decode(''.join(chunks))
          digest = hashlib.sha256(data).hexdigest()
          if digest != manifest['sha256']:
              print('SHA256 mismatch', digest, manifest['sha256'], file=sys.stderr)
              sys.exit(1)
          Path(manifest['filename']).write_bytes(data)
          print('Reconstructed', manifest['filename'], 'size', len(data))
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build packages
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null || true
          set -o pipefail
          sdkmanager \
            'platform-tools' \
            'platforms;android-35' \
            'build-tools;35.0.0' \
            'ndk;30.0.16248370' \
            'cmake;3.22.1'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Resolve source directory
        id: source
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$GITHUB_WORKSPACE/Diplomka_Native_CPP_Source.zip"
          if [ -f "$ARCHIVE" ]; then
            SRC_PARENT="$RUNNER_TEMP/diplomka-src"
            mkdir -p "$SRC_PARENT"
            unzip -q "$ARCHIVE" -d "$SRC_PARENT"
            if [ -f "$SRC_PARENT/settings.gradle" ]; then
              SRC_DIR="$SRC_PARENT"
            else
              SRC_DIR="$(find "$SRC_PARENT" -mindepth 1 -maxdepth 4 -name settings.gradle -print -quit | xargs -r dirname)"
            fi
            echo "Using ZIP sources"
          else
            SRC_DIR="$GITHUB_WORKSPACE"
            echo "Using checked-out tree"
          fi
          test -n "$SRC_DIR"
          test -f "$SRC_DIR/app/src/main/cpp/CMakeLists.txt"
          test -f "$SRC_DIR/settings.gradle"
          echo "src_dir=$SRC_DIR" >> "$GITHUB_OUTPUT"
          echo "SRC_DIR=$SRC_DIR"

      - name: Download NCNN Android CPU runtime (arm64-v8a)
        id: ncnn
        shell: bash
        run: |
          set -euo pipefail
          DEP="$RUNNER_TEMP/diplomka-deps/ncnn"
          mkdir -p "$DEP"
          curl --fail --location --retry 4 \
            'https://github.com/Tencent/ncnn/releases/download/20261020/ncnn-20261020-android.zip' \
            -o "$RUNNER_TEMP/ncnn-android.zip"
          echo '62a9edb493ceb42a5c9cbf2d3a79b3f44bff06c625134ffb64d183dcc42c25fc  ncnn-android.zip' > "$RUNNER_TEMP/ncnn.sha256"
          (cd "$RUNNER_TEMP" && sha256sum --check ncnn.sha256)
          unzip -q "$RUNNER_TEMP/ncnn-android.zip" -d "$DEP"
          CONFIG="$(find "$DEP" -path '*/arm64-v8a/lib/cmake/ncnn/ncnnConfig.cmake' -print -quit)"
          if [ -z "$CONFIG" ]; then
            echo 'arm64-v8a ncnnConfig.cmake not found'
            find "$DEP" -name ncnnConfig.cmake -print
            exit 1
          fi
          NCNN_CMAKE_DIR="$(dirname "$CONFIG")"
          echo "ncnn_dir=$NCNN_CMAKE_DIR" >> "$GITHUB_OUTPUT"
          echo "NCNN: $NCNN_CMAKE_DIR"

      - name: Download pretrained NCNN models
        shell: bash
        env:
          SRC_DIR: ${{ steps.source.outputs.src_dir }}
        run: |
          set -euo pipefail
          ASSETS="$SRC_DIR/app/src/main/assets"
          mkdir -p "$ASSETS"
          BASE='https://raw.githubusercontent.com/nihui/ncnn-android-yolov8/20260527.f1ac75e/app/src/main/assets'
          curl --fail --location --retry 4 "$BASE/yolov8n.ncnn.param" -o "$ASSETS/yolov8n.ncnn.param"
          curl --fail --location --retry 4 "$BASE/yolov8n.ncnn.bin" -o "$ASSETS/yolov8n.ncnn.bin"
          curl --fail --location --retry 4 "$BASE/yolov8n_pose.ncnn.param" -o "$ASSETS/yolov8n_pose.ncnn.param"
          curl --fail --location --retry 4 "$BASE/yolov8n_pose.ncnn.bin" -o "$ASSETS/yolov8n_pose.ncnn.bin"
          test "$(wc -c < "$ASSETS/yolov8n.ncnn.bin")" -gt 100000
          sha256sum "$ASSETS"/*

      - name: Build APK
        shell: bash
        env:
          SRC_DIR: ${{ steps.source.outputs.src_dir }}
          NCNN_DIR: ${{ steps.ncnn.outputs.ncnn_dir }}
        run: |
          set -euo pipefail
          echo "NCNN_DIR=$NCNN_DIR"
          test -f "$NCNN_DIR/ncnnConfig.cmake"
          gradle --no-daemon --stacktrace \
            -PncnnDir="$NCNN_DIR" \
            -p "$SRC_DIR" \
            :app:assembleRelease
          mkdir -p "$RUNNER_TEMP/diplomka-output"
          APK="$SRC_DIR/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK" || { find "$SRC_DIR/app/build/outputs" -type f -maxdepth 6 -print; exit 1; }
          cp "$APK" "$RUNNER_TEMP/diplomka-output/Diplomka-Native-C++-arm64-v8a.apk"
          sha256sum "$RUNNER_TEMP/diplomka-output/Diplomka-Native-C++-arm64-v8a.apk"
          ls -lh "$RUNNER_TEMP/diplomka-output"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Diplomka-Native-Cpp-APK
          path: ${{ runner.temp }}/diplomka-output/Diplomka-Native-C++-arm64-v8a.apk
          if-no-files-found: error
          retention-days: 14
