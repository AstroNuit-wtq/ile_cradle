name: Build Astro_Nuit Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: |
          if [ -f gradlew ]; then chmod +x gradlew; fi

      - name: Build APK
        run: |
          # Use gradle wrapper if present, otherwise system gradle via the action
          if [ -f gradlew ]; then
            ./gradlew assembleRelease --no-daemon
          else
            gradle assembleRelease --no-daemon
          fi

      - name: Find and package APK
        if: always()
        run: |
          mkdir -p output
          find . -name "*.apk" -type f 2>/dev/null | head -5
          APK=$(find . -path "*/release/*.apk" -type f 2>/dev/null | head -1 || true)
          if [ -n "$APK" ]; then
            echo "Found APK: $APK"
            cp "$APK" output/AstroNuit-release.apk
            ls -lh output/
          else
            echo "No release APK found"
            find . -name "*.apk" -exec cp {} output/ \; 2>/dev/null || true
            ls -la output/ || true
          fi

      - name: Upload Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AstroNuit-Android
          path: output/
          retention-days: 7
          if-no-files-found: warn
