name: Build Ile_Cradle

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: |
          if [ -f gradlew ]; then chmod +x gradlew; fi

      - name: Build debug APK (auto-signed, installable)
        run: |
          if [ -f gradlew ]; then
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Package APK
        if: always()
        run: |
          mkdir -p output
          echo "=== All APKs ==="
          find . -name "*.apk" -type f 2>/dev/null

          APK=$(find . -path "*/debug/*.apk" -type f 2>/dev/null | head -1 || true)
          if [ -z "$APK" ]; then
            APK=$(find . -name "*.apk" -type f 2>/dev/null | head -1 || true)
          fi

          if [ -n "$APK" ]; then
            echo "Found APK: $APK"
            cp "$APK" output/Ile_Cradle-debug.apk
            ls -lh output/
            # show if signed
            $ANDROID_HOME/build-tools/*/aapt dump badging output/Ile_Cradle-debug.apk 2>/dev/null | head -5 || true
          else
            echo "ERROR: No APK found"
            ls -la
          fi

      - name: Upload Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Ile_Cradle-Android
          path: output/
          retention-days: 7
          if-no-files-found: warn
