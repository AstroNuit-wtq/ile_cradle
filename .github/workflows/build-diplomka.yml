name: Build Diplomka APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create Gradle Wrapper (if missing)
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.5
          fi
          chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Package APK
        if: always()
        run: |
          mkdir -p output
          echo "=== Looking for APKs ==="
          find . -name "*.apk" -type f 2>/dev/null || true

          APK=$(find . -path "*/debug/*.apk" -type f 2>/dev/null | head -1 || true)
          if [ -z "$APK" ]; then
            APK=$(find . -name "*.apk" -type f 2>/dev/null | head -1 || true)
          fi

          if [ -n "$APK" ]; then
            echo "Found APK: $APK"
            cp "$APK" output/Diplomka-debug.apk
            ls -lh output/
          else
            echo "ERROR: No APK found"
            ls -la
            find . -type f -name "*.apk" || true
          fi

      - name: Upload Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Diplomka-Android
          path: output/
          retention-days: 14
          if-no-files-found: warn
