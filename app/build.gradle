plugins {
    id 'com.android.application'
}

android {
    namespace 'com.diplomka.app'
    compileSdk 35
    ndkVersion '30.0.16248370'

    defaultConfig {
        applicationId 'com.diplomka.app'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '2.0.0-native'
        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++20 -O3 -fno-exceptions -fno-rtti'
                arguments '-DANDROID_STL=c++_shared', "-Dncnn_DIR=${providers.gradleProperty('ncnnDir').orElse('').get()}"
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    androidResources {
        noCompress += ['bin', 'param']
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
        resources {
            excludes += ['/META-INF/AL2.0', '/META-INF/LGPL2.1']
        }
    }
}
